[project]
name = "srp-irrigation"
version = "0.1.0"
description = "Scrape SRP flood irrigation schedules"
readme = "README.md"
authors = [
    { name = "fmoor", email = "mailfrederickmoor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3",
    "playwright>=1.55",
    "requests>=2.34.2",
]

[project.scripts]
srp-irrigation = "srp_irrigation:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]
